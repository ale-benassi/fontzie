name: Chrome Web Store
on:
  workflow_call:
  # A manual run on main checks the connection and prints the current versions.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  store:
    if: github.repository == 'ale-benassi/fontzie' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref_type == 'tag'))
    concurrency: fontzie-chrome-store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Run the publishing code from main, including when verifying a tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-store-package
          path: store-package
      - name: Check the tag, commit and packaged manifest
        if: github.event_name == 'push'
        working-directory: store-package
        run: |
          set -eu
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          sha256sum --check SHA256SUMS
          test "$(unzip -p "fontzie-$version-chrome.zip" manifest.json | jq -er .version)" = "$version"
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: ${{ github.event_name == 'push' && 'https://www.googleapis.com/auth/chromewebstore' || 'https://www.googleapis.com/auth/chromewebstore.readonly' }}
          create_credentials_file: false
      - name: Check store status or submit the tagged ZIP
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            node scripts/chrome-store.mjs "${GITHUB_REF_NAME#v}"
          else
            node scripts/chrome-store.mjs
          fi
